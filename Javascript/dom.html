<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1>DOM Methods</h1>
    <p>getElementsbytagName</p>
    <p id="para" class = "bluetext">getElementsbyId</p>
    <p class="bluetext">getElementsbyclassname</p>
    <p>getElementsbyname</p>
    <h4>Hello</h4>
    <h4>Thank you</h4>
    <input type="text" placeholder="Enter your fav cricket player" name="favPalyer"><br>
    <p id="displayValue">Value displayed here</p>
    <button onclick = "change()">Click Me to change</button>
    <script>

        
       let h4Elements = document.querySelectorAll("h4");
       h4Elements.forEach(h4Element => {
        h4Element.style.color = "white";
        h4Element.style.backgroundColor = "black";
       }
       );

        document.querySelector("h1").innerText = "DOM methods in Javascript";
        document.querySelector("button").textContent = "click me";
        document.querySelector("h1").innerHTML = "<i>DOM methods in Javascript</i>";

        document.getElementById("para").style.fontSize = "30px";
         document.getElementsByTagName("p")[0].style.color = "green";

      let bt =  document.getElementsByClassName("bluetext");
        for(let i = 0; i <= bt.length; i++) {
            bt[i].style.color = "blue";
            bt[i].style.backgroundColor ="green";
        }
      function change() {

      let favPlayerValue =  document.getElementsByName("favPalyer")[0].value ;
        document.getElementById("displayValue").innerText = favPlayerValue;

       // document.getElementsByTagName("p")[0].style.color = "red";
      
       let para = document.getElementsByTagName("p");
       for (let i =0; i <= para.length-1; i++) {
        para[i].style.color = "red";
        para[i].style.backgroundColor = "yellow";
       }
    }
    </script>
    
</body>
</html>
